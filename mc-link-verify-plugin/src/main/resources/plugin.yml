name: LinkVerify
version: 1.0.0
main: com.esmp.linkverify.LinkVerifyPlugin
api-version: '1.21'
author: ESMP
description: Verifies Discord whitelist account ownership through a Minecraft /link code.
softdepend:
  - floodgate
commands:
  link:
    description: Verify your Minecraft account with a Discord whitelist code.
    usage: /link <code>
    aliases:
      - verifylink
      - mclink
    permission: linkverify.link
permissions:
  linkverify.link:
    description: Allows a player to link their Minecraft account.
    default: true
