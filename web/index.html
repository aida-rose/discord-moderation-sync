<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>INSMP</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101820;
        --panel: #162330;
        --text: #f7fbff;
        --muted: #b9c8d8;
        --accent: #31c6d9;
        --line: #284052;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      section {
        width: min(720px, 100%);
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 8px;
        padding: 40px;
      }

      h1 {
        margin: 0;
        font-size: 48px;
        line-height: 1;
        letter-spacing: 0;
      }

      p {
        margin: 18px 0 0;
        max-width: 58ch;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.6;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        min-height: 32px;
        margin-bottom: 24px;
        color: var(--accent);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      @media (max-width: 560px) {
        main {
          padding: 18px;
        }

        section {
          padding: 28px;
        }

        h1 {
          font-size: 38px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <div class="tag">INSMP</div>
        <h1>Website coming soon.</h1>
        <p>
          The official INSMP site is being set up. Account linking and Discord
          authentication run separately at auth.insmp.org.
        </p>
      </section>
    </main>
  </body>
</html>
